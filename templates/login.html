{% extends "base.html" %}
{% block title %}Login - EcoWise{% endblock %}
{% block content %}
<main class="auth-page">
  <div class="container">
    <div class="auth-card eco-card mx-auto p-4 p-md-5">
      <h1 class="h2 fw-black">Welcome back</h1>
      <p class="text-muted">Login with your Flask session account.</p>
      <form method="post">
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="email" required>
        <label class="form-label">Password</label>
        <input class="form-control mb-4" type="password" name="password" required>
        <button class="btn btn-success w-100" type="submit">Login</button>
      </form>
      <p class="small mt-3 mb-0">Demo admin: <b>admin@ecowise.local</b> / <b>admin123</b></p>
      <a class="small d-inline-block mt-2" href="{{ url_for('signup') }}">Create a new account</a>
    </div>
  </div>
</main>
{% endblock %}
